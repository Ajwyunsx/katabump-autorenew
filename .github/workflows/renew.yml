name: KataBump auto renew

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      headless:
        description: "Run headless"
        default: "1"
        required: false

concurrency:
  group: katabump-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
          # real Chrome is far more likely to pass Turnstile than bundled Chromium
          python -m playwright install chrome || sudo apt-get install -y google-chrome-stable

      - name: Run renewal (virtual display)
        id: run
        continue-on-error: true
        env:
          KB_EMAIL: ${{ secrets.KB_EMAIL }}
          KB_PASSWORD: ${{ secrets.KB_PASSWORD }}
          KB_HEADLESS: "0"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a --server-args="-screen 0 1366x900x24" python src/renew.py

      - name: Show result
        if: always()
        run: |
          echo "--- result.json ---"
          cat state/result.json 2>/dev/null || echo "(no result)"
          echo
          echo "--- screenshots ---"
          ls -la screenshots/ 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-${{ github.run_id }}
          path: |
            screenshots/
            state/
          retention-days: 14

      - name: Open issue on failure
        if: steps.run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Automated renewal did not succeed.\n\n';
            try {
              body += '```json\n' + fs.readFileSync('state/result.json', 'utf8') + '\n```\n';
            } catch (e) {
              body += 'No result file produced.\n';
            }
            body += `\nRun: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}\n`;
            body += '\nPlease renew manually and re-check the credentials.\n';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `KataBump renewal failed - ${new Date().toISOString().slice(0, 10)}`,
              body,
            });
